<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="MemoDump - Markdown Notes" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#6495ED" />
  <script>
    // Apply theme before paint to prevent FOUC
    (function(){
      try {
        var theme = localStorage.getItem('memodump_theme');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          // system: use media query, remove explicit data-theme
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        }
      } catch(_) {}
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MemoDump" />
  <link rel="apple-touch-icon" href="/icon-512.png" />

  <link rel="icon" type="image/png" href="/favicon.ico" />
  <link rel="stylesheet" href="/custom.css" />
  <title>MemoDump</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Register service worker for PWA — but NOT inside the Wails desktop
    // WebView, where a SW is pointless and can intercept/cache the app shell
    // and break asset loading on relaunch.
    (function () {
      var isWails = location.protocol === 'wails:' || location.hostname === 'wails.localhost'
      if (!isWails && 'serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }
    })()
  </script>
</body>

</html>
