name: Build & Release

on:
  push:
    branches: [public, main]
    tags: ['v*']
  pull_request:
    branches: [public, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  WAILS_VERSION: "v2.12.0"

jobs:
  # ---- Server CLI: cross-compiled on Linux (cheap, runs on every push/PR) ----
  build-cli:
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64,           output: memodump-server-linux-amd64       }
          - { goos: linux,   goarch: arm64,           output: memodump-server-linux-arm64       }
          - { goos: linux,   goarch: arm,   goarm: "7", output: memodump-server-linux-arm       }
          - { goos: windows, goarch: amd64,           output: memodump-server-windows-amd64.exe }
          - { goos: windows, goarch: "386",           output: memodump-server-windows-386.exe   }
          - { goos: darwin,  goarch: amd64,           output: memodump-server-darwin-amd64      }
          - { goos: darwin,  goarch: arm64,           output: memodump-server-darwin-arm64      }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o "${{ matrix.output }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 7

  # ---- Desktop (Wails): native runners. Gated to tags / manual dispatch because
  #      macOS runner minutes bill at 10x — we don't want every push to spend them. ----
  build-desktop:
    name: Desktop (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-amd64,   asset: MemoDump-desktop-windows-amd64.exe }
          - { os: macos-latest,   label: macos-universal,  asset: MemoDump-desktop-macos-universal.zip }
          - { os: ubuntu-22.04,    label: linux-amd64,     asset: MemoDump-desktop-linux-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Wails on Linux needs GTK3 + WebKit2GTK 4.0 — ubuntu-22.04 ships the 4.0 dev
      # package (24.04 only has 4.1, which needs a different build tag).
      - name: Install Linux WebKit/GTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # Build frontend first — Wails bindings generation compiles Go code,
      # which embeds frontend/dist and fails if it doesn't exist yet.
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build desktop app (Linux / Windows)
        if: runner.os != 'macOS'
        run: wails build -tags production -ldflags "-s -w"

      - name: Build desktop app (macOS universal)
        if: runner.os == 'macOS'
        run: wails build -tags production -ldflags "-s -w" -platform darwin/universal

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item build/bin/MemoDump.exe "${{ matrix.asset }}"

      - name: Package binary (Linux)
        if: runner.os == 'Linux'
        run: cp build/bin/MemoDump "${{ matrix.asset }}"

      # .app is a bundle (directory); ditto zips it preserving the bundle structure.
      - name: Package app bundle (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/MemoDump.app "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 7

  # ---- Release: collect every artifact onto a GitHub Release for v* tags ----
  release:
    name: Release
    needs: [build-cli, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Sync release to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"
          OWNER="CarbonC"
          REPO="MemoDump"
          API="https://codeberg.org/api/v1/repos/$OWNER/$REPO"

          BODY=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q '.body')

          # Idempotent create-or-get release
          EXISTING=$(curl -sS --retry 3 --retry-delay 5 -H "accept: application/json" \
            -H "Authorization: token $CODEBERG_TOKEN" \
            "$API/releases/tags/$TAG")
          EXISTING_ID=$(echo "$EXISTING" | jq -r '.id // empty')

          if [ -n "$EXISTING_ID" ]; then
            echo "Release exists on Codeberg (id=$EXISTING_ID)"
          else
            echo "Creating release on Codeberg..."
            RESPONSE=$(curl -sS --retry 3 --retry-delay 5 -X POST "$API/releases" \
              -H "accept: application/json" \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg tag "$TAG" --arg name "$TAG" --arg body "$BODY" '{tag_name: $tag, name: $name, body: $body}')")
            EXISTING_ID=$(echo "$RESPONSE" | jq -r '.id')
            echo "Created release id=$EXISTING_ID"
          fi

          # Upload assets with retry and rate-limit awareness
          for f in dist/*; do
            fname=$(basename "$f")
            fsize=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "?")
            echo "Uploading $fname ($fsize bytes)..."

            # Remove stale asset with same name
            EXISTING_ASSETS=$(curl -sS --retry 3 --retry-delay 5 -H "accept: application/json" \
              -H "Authorization: token $CODEBERG_TOKEN" \
              "$API/releases/$EXISTING_ID/assets")
            OLD_ID=$(echo "$EXISTING_ASSETS" | jq -r ".[] | select(.name==\"$fname\") | .id // empty")
            if [ -n "$OLD_ID" ]; then
              HTTP=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 \
                -X DELETE -H "Authorization: token $CODEBERG_TOKEN" \
                "$API/releases/$EXISTING_ID/assets/$OLD_ID")
              echo "  Deleted old asset (HTTP $HTTP)"
            fi

            # Upload with retries; Codeberg can 500 on large files, backoff helps
            HTTP=$(curl -sS -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 \
              --retry-max-time 120 -X POST \
              -H "accept: application/json" \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -F "attachment=@$f" \
              "$API/releases/$EXISTING_ID/assets?name=$fname")
            if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
              echo "  OK (HTTP $HTTP)"
            else
              echo "  FAILED (HTTP $HTTP)"
              exit 1
            fi

            sleep 1
          done

          echo "Codeberg release synced: https://codeberg.org/$OWNER/$REPO/releases/tag/$TAG"
