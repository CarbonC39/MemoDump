name: Build and Release

on:
  push:
    branches: [ "public" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "public" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── CLI server ─────────────────────────────────────────────────────────────
  build-server:
    name: Server (${{ matrix.binary_name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            binary_name: memodump-linux-amd64
          - os: linux
            arch: arm64
            binary_name: memodump-linux-arm64
          - os: linux
            arch: arm
            binary_name: memodump-linux-arm
          - os: windows
            arch: amd64
            binary_name: memodump-windows-amd64.exe
          - os: windows
            arch: 386
            binary_name: memodump-windows-386.exe
          - os: darwin
            arch: amd64
            binary_name: memodump-darwin-amd64
          - os: darwin
            arch: arm64
            binary_name: memodump-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build server binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -o ${{ matrix.binary_name }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}

  # ── Wails desktop app ──────────────────────────────────────────────────────
  build-desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            os: windows
          - runner: macos-latest
            os: macos
          - runner: ubuntu-22.04
            os: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app
        if: matrix.os != 'windows'
        run: wails build

      - name: Build desktop app (Windows, suppress console)
        if: matrix.os == 'windows'
        run: wails build -ldflags "-H windowsgui"

      - name: Rename Windows desktop binary
        if: matrix.os == 'windows'
        run: mv build/bin/MemoDump.exe memodump-desktop-windows-amd64.exe

      - name: Upload Windows artifact
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: memodump-desktop-windows-amd64
          path: memodump-desktop-windows-amd64.exe

      - name: Package macOS artifact
        if: matrix.os == 'macos'
        run: cd build/bin && zip -r memodump-desktop-macos-universal.zip MemoDump.app

      - name: Upload macOS artifact
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: memodump-desktop-macos-universal
          path: build/bin/memodump-desktop-macos-universal.zip

      - name: Rename Linux desktop binary
        if: matrix.os == 'linux'
        run: mv build/bin/MemoDump memodump-desktop-linux-amd64

      - name: Upload Linux artifact
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: memodump-desktop-linux-amd64
          path: memodump-desktop-linux-amd64

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-server, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/memodump-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
