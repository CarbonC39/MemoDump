name: Build & Release

on:
  push:
    branches: [public]
    tags: ['v*']
  pull_request:
    branches: [public]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  WAILS_VERSION: "v2.12.0"

jobs:
  # ---- Server CLI: cross-compiled on Linux (cheap, runs on every push/PR) ----
  build-cli:
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64,           output: memodump-server-linux-amd64       }
          - { goos: linux,   goarch: arm64,           output: memodump-server-linux-arm64       }
          - { goos: linux,   goarch: arm,   goarm: "7", output: memodump-server-linux-arm       }
          - { goos: windows, goarch: amd64,           output: memodump-server-windows-amd64.exe }
          - { goos: windows, goarch: "386",           output: memodump-server-windows-386.exe   }
          - { goos: darwin,  goarch: amd64,           output: memodump-server-darwin-amd64      }
          - { goos: darwin,  goarch: arm64,           output: memodump-server-darwin-arm64      }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          npm run verify:server-build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o "${{ matrix.output }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 7

  # ---- Desktop (Wails): native runners. Gated to tags / manual dispatch because
  #      macOS runner minutes bill at 10x — we don't want every push to spend them. ----
  build-desktop:
    name: Desktop (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-amd64,   asset: MemoDump-desktop-windows-amd64.exe,   wails_tags: production }
          - { os: macos-latest,   label: macos-universal, asset: MemoDump-desktop-macos-universal.zip, wails_tags: production }
          # Linux: WebKit2GTK 4.1 (libsoup3) via the webkit2_41 tag. The old 4.0 stack
          # was removed from the ubuntu-22.04 runner image — libwebkit2gtk-4.0-dev no
          # longer installs, so a 4.0 build dies at link with "cannot find -lwebkit2gtk-4.0".
          # 4.1 is also what current distros ship (Debian 13, Ubuntu 24.04+, recent Fedora).
          - { os: ubuntu-22.04,    label: linux-amd64,     asset: MemoDump-desktop-linux-amd64,         wails_tags: "production,webkit2_41", apt: libwebkit2gtk-4.1-dev }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Wails on Linux needs GTK3 + WebKit2GTK 4.1; the dev package and matching
      # webkit2_41 build tag come from the matrix.
      - name: Install Linux WebKit/GTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ${{ matrix.apt }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # Build frontend first — Wails bindings generation compiles Go code,
      # which embeds frontend/dist and fails if it doesn't exist yet.
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          npm run verify:server-build

      - name: Build desktop app (Linux / Windows)
        if: runner.os != 'macOS'
        run: wails build -tags "${{ matrix.wails_tags }}" -ldflags "-s -w"

      - name: Build desktop app (macOS universal)
        if: runner.os == 'macOS'
        run: wails build -tags "${{ matrix.wails_tags }}" -ldflags "-s -w" -platform darwin/universal

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item build/bin/MemoDump.exe "${{ matrix.asset }}"

      - name: Package binary (Linux)
        if: runner.os == 'Linux'
        run: cp build/bin/MemoDump "${{ matrix.asset }}"

      # .app is a bundle (directory); ditto zips it preserving the bundle structure.
      - name: Package app bundle (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/MemoDump.app "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 7

  # ---- Docker: headless CLI server image, gated to tags / manual dispatch
  #      like the desktop build so untrusted PRs can't push to the registry. ----
  docker:
    name: Docker image
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Hardcoded lowercase: ghcr.io repo names must be lowercase, and
          # github.repository_owner here is "CarbonC" (mixed case).
          images: ghcr.io/carbonc39/memodump
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---- Release: collect every artifact onto a GitHub Release for v* tags ----
  release:
    name: Release
    needs: [build-cli, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Pin the release to the tagged commit rather than the default branch.
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false

      # Keep publication explicit. If the upload action ever leaves its
      # temporary release draft behind, fail the job unless GitHub accepts the
      # final transition to a published release.
      - name: Ensure release is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
