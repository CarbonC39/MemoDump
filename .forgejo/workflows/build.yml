name: Build & Release

on:
  push:
    branches: [public]
    tags: ['v*']
  pull_request:
    branches: [public]
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: codeberg-small
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64,  output: memodump-linux-amd64        }
          - { goos: linux,   goarch: arm64,  output: memodump-linux-arm64        }
          - { goos: linux,   goarch: arm,    goarm: "7", output: memodump-linux-arm }
          - { goos: windows, goarch: amd64,  output: memodump-windows-amd64.exe  }
          - { goos: windows, goarch: "386",  output: memodump-windows-386.exe    }
          - { goos: darwin,  goarch: amd64,  output: memodump-darwin-amd64       }
          - { goos: darwin,  goarch: arm64,  output: memodump-darwin-arm64       }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o ${{ matrix.output }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 7

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: codeberg-small
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          API="https://codeberg.org/api/v1"

          # Create the release (no-op if it already exists)
          curl -sf -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"generate_release_notes\":false}" \
            "${API}/repos/${OWNER}/${REPO}/releases" > /dev/null 2>&1 || true

          # Resolve release ID from tag
          RELEASE_ID=$(curl -sf \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${API}/repos/${OWNER}/${REPO}/releases/tags/${TAG}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          # Upload each binary
          for f in dist/*; do
            name=$(basename "$f")
            echo "Uploading $name …"
            curl -sf -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${f};filename=${name}" \
              "${API}/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/assets" > /dev/null
          done
